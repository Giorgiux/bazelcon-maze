<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maze &mdash; BazelCon Workshop</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Bazel Maze</h1>
        <div id="hud">
          <span id="level-name">&mdash;</span>
          <span id="keys-count">keys 0/0</span>
        </div>
      </header>
      <canvas id="maze" width="480" height="480"></canvas>
      <p id="status">Arrow keys / WASD to move. Grab every key, then reach the exit.</p>
      <footer>
        <span id="build-stamp">build: dev</span>
      </footer>
    </div>

    <!-- Level data generated by the Bazel build graph. No fetch(); runs from file://. -->
    <script src="levels.js"></script>
    <!-- Optional build stamp; absent unless //web:buildstamp is built. -->
    <script src="version.js" onerror="/* optional */"></script>
    <script src="game.js"></script>
  </body>
</html>
